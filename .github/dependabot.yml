version: 2
# Security updates for npm are handled by the repository's
# "Dependabot security updates" setting (driven by Dependabot alerts), so we do
# not enable broad npm version-update PRs here to keep the PR queue clean.
# We only keep GitHub Actions version updates, which are low-noise.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - ci
